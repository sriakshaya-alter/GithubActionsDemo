


name: Checkout

on: workflow_dispatch

jobs:
  without-checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Try to list files BEFORE checkout
        run: ls -la
  

  with-checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5
   

      - name: List files AFTER checkout
        run: ls -la
   
